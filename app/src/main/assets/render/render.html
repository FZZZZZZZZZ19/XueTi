<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="katex.min.css">
    <script src="katex.min.js"></script>
    <script src="auto-render.min.js"></script>
    <script src="marked.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            word-wrap: break-word;
            overflow-wrap: break-word;
            -webkit-text-size-adjust: 100%;
        }
        body {
            font-family: -apple-system, "Noto Sans SC", "Source Han Sans", sans-serif;
            line-height: 1.65;
            padding: 2px 0 8px 0;
        }
        h1, h2, h3, h4 { line-height: 1.35; margin: 14px 0 6px 0; font-weight: 600; }
        h1 { font-size: 1.28em; }
        h2 { font-size: 1.18em; }
        h3 { font-size: 1.08em; }
        h4 { font-size: 1.0em; }
        p { margin: 6px 0; }
        ul, ol { margin: 6px 0; padding-left: 22px; }
        li { margin: 2px 0; }
        hr { border: none; border-top: 1px solid rgba(128, 128, 128, 0.35); margin: 12px 0; }
        code {
            font-family: "SF Mono", Consolas, monospace;
            font-size: 0.92em;
            padding: 1px 4px;
            border-radius: 4px;
            background: rgba(128, 128, 128, 0.16);
        }
        pre {
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            background: rgba(128, 128, 128, 0.12);
        }
        pre code { background: transparent; padding: 0; }
        blockquote {
            margin: 8px 0;
            padding: 2px 10px;
            border-left: 3px solid rgba(128, 128, 128, 0.5);
            opacity: 0.9;
        }
        table { border-collapse: collapse; margin: 8px 0; width: 100%; }
        th, td { border: 1px solid rgba(128, 128, 128, 0.4); padding: 4px 6px; font-size: 0.95em; }
        th { background: rgba(128, 128, 128, 0.12); }
        .katex { font-size: 1.06em; }
        .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; margin: 8px 0; }
        .katex-error { color: #d32f2f; }
        a.pageref {
            color: #1565c0;
            text-decoration: none;
            background: rgba(21, 101, 192, 0.10);
            border-radius: 4px;
            padding: 0 4px;
            font-size: 0.85em;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div id="content"></div>
<script>
    (function () {
        var CONTENT = document.getElementById('content');

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        /** 模型偶尔直接输出 \begin{aligned}…\end{aligned}，补上 $$ 才能渲染 */
        function wrapBareEnvironments(text) {
            return String(text).replace(
                /\\begin\{(equation\*?|align\*?|aligned|gather\*?|array|cases|pmatrix|bmatrix|vmatrix|Vmatrix|matrix|split)\}([\s\S]*?)\\end\{\1\}/g,
                function (match, env) {
                    if (match.indexOf('$$') === 0) return match;
                    return '$$' + match + '$$';
                }
            );
        }

        /**
         * 【关键】把公式整段"藏起来"再交给 Markdown 解析。
         *
         * 原因：CommonMark 会把 \( \) \[ \] \_ \{ \} \* 这类反斜杠序列当作转义符吃掉，
         * 于是 LaTeX 剩下裸的 \cap、\bar（这正是"公式不显示"的根因）。
         * 这里先把公式替换成占位符，解析完 Markdown 再原样放回，交给 KaTeX 渲染。
         */
        var PLACEHOLDER_PREFIX = '\u0001MATH';
        var PLACEHOLDER_SUFFIX = '\u0001';

        function protectMath(text) {
            var store = [];
            function stash(raw) {
                store.push(raw);
                return PLACEHOLDER_PREFIX + (store.length - 1) + PLACEHOLDER_SUFFIX;
            }
            var out = wrapBareEnvironments(text);
            // 1) 独立公式 $$ ... $$
            out = out.replace(/\$\$([\s\S]*?)\$\$/g, stash);
            // 2) \[ ... \] → $$ ... $$
            out = out.replace(/\\\[([\s\S]*?)\\\]/g, function (m, body) {
                return stash('$$' + body + '$$');
            });
            // 3) 行内 \( ... \) → $ ... $
            out = out.replace(/\\\(([\s\S]*?)\\\)/g, function (m, body) {
                return stash('$' + body + '$');
            });
            // 4) 行内 $ ... $（不跨行）
            out = out.replace(/\$([^$\n]+?)\$/g, stash);
            // 5) 剩下的裸 LaTeX 环境
            out = wrapBareEnvironments(out).replace(/\$\$([\s\S]*?)\$\$/g, function (m) {
                return stash(m);
            });
            return {text: out, store: store};
        }

        function restoreMath(html, store) {
            if (!store.length) return html;
            return html.replace(
                new RegExp(PLACEHOLDER_PREFIX + '(\\d+)' + PLACEHOLDER_SUFFIX, 'g'),
                function (m, index) {
                    var raw = store[parseInt(index, 10)];
                    return (raw === undefined) ? m : raw;
                }
            );
        }

        /**
         * v2.06：把模型标的页码出处 `[p.12]` / `[p.12-14]` 变成可点链接，
         * 点一下由 App 打开教材 PDF 第 N 页对照原文。
         * 用 href="xueti-page:N" 自定义 scheme，交给 Android 侧拦截。
         */
        function linkifyPageRefs() {
            var html = CONTENT.innerHTML;
            if (!html || html.indexOf('[p.') < 0) return;
            CONTENT.innerHTML = html.replace(
                /\[p\.(\d{1,4})(?:\s*[-–~]\s*(\d{1,4}))?\]/g,
                function (match, start, end) {
                    var page = parseInt(start, 10);
                    if (!page) return match;
                    var label = end ? ('p.' + start + '-' + end) : ('p.' + start);
                    return '<a class="pageref" href="xueti-page:' + page + '">' + label + '</a>';
                }
            );
        }

        function renderMath() {
            if (typeof renderMathInElement !== 'function') return;
            try {
                renderMathInElement(CONTENT, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '\\[', right: '\\]', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false}
                    ],
                    throwOnError: false,
                    errorColor: '#d32f2f',
                    ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option']
                });
            } catch (e) {
                /* 渲染失败时保留原始文本，不阻断阅读 */
            }
        }

        /**
         * 渲染 Markdown + LaTeX。
         * @param text  模型输出的原文
         * @param color 正文颜色（跟随 App 主题）
         * @param fontSize 正文字号（px）
         */
        window.renderContent = function (text, color, fontSize) {
            var src = (text === null || text === undefined) ? '' : String(text);
            document.body.style.color = color || '#111111';
            document.body.style.fontSize = (fontSize || 15) + 'px';

            var protectedResult = protectMath(src);
            var html = null;
            try {
                if (typeof marked !== 'undefined') {
                    if (typeof marked.parse === 'function') {
                        html = marked.parse(protectedResult.text);
                    } else if (typeof marked === 'function') {
                        html = marked(protectedResult.text);
                    }
                }
            } catch (e) {
                html = null;
            }
            if (html === null) {
                // Markdown 解析不可用时退化为纯文本，但仍要渲染公式
                html = escapeHtml(src).replace(/\n/g, '<br>');
            } else {
                html = restoreMath(html, protectedResult.store);
            }
            CONTENT.innerHTML = html;
            linkifyPageRefs();
            renderMath();
            return document.body.scrollHeight;
        };

        /** 纯文本模式（不解析 Markdown，只渲染公式） */
        window.renderPlain = function (text, color, fontSize) {
            document.body.style.color = color || '#111111';
            document.body.style.fontSize = (fontSize || 15) + 'px';
            CONTENT.innerHTML = escapeHtml(String(text || '')).replace(/\n/g, '<br>');
            renderMath();
            return document.body.scrollHeight;
        };

        window.contentHeight = function () {
            return document.body.scrollHeight;
        };
    })();
</script>
</body>
</html>
